services:
  postgres:
    image: postgres:16  
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data  
  app:
    build: .
    ports:
      - 8080:8080
    depends_on:
      - postgres

volumes:
  pg_data:  